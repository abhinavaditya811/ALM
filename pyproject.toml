[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analytixllm"
version = "0.1.0"
description = "Reliability-analysis skills over messy maintenance work orders, plus a scoring/gating harness."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "anthropic>=0.110",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "mypy>=1.5",
    "ruff>=0.1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
mypy_path = "src"
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
